<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Oyun Portalı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: sans-serif;
            background: #1a1b26;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }
        h1 {
            color: #6c5ce7;
            margin-bottom: 25px;
            font-size: 1.8rem;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .oyun-kutusu {
            background: #2d2d44;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #444466;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .oyun-kutusu h3 {
            margin-bottom: 10px;
        }
        .oyun-kutusu p {
            color: #a9b1d6;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #6c5ce7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🎮 Bizim Oyun Portalı</h1>

    <div class="container">
        <div class="oyun-kutusu">
            <h3>🎯 Sayı Tahmin Oyunu</h3>
            <p>Bilgisayar bir sayı tutar ve onu bilmeye çalışırsın.</p>
            <a href="sayıtahminoyunu.html" class="btn">Oyna</a>
        </div>

        <div class="oyun-kutusu">
            <h3>🐍 Yılan Oyunu</h3>
            <p>Klasik yılan oyunu.</p>
            <a href="yılan.html" class="btn">Oyna</a>
        </div>

        <div class="oyun-kutusu">
            <h3>🔒 Çok Yakında Sizinle</h3>
            <p>Bu oyun daha yapılmadı ama üstteki oyunların keyfini çıkarın.</p>
            <a href="#" class="btn" style="opacity: 0.5;">Oyna</a>
        </div>
    </div>

</body>
</html>
