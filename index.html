<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bizim Oyun Portalı</title>
  <style>
    body {
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 { color: #6c5ce7; }

    .oyun-kutusu {
      background: #2d2d44;
      border-radius: 12px;
      padding: 15px;
      margin: 15px auto;
      max-width: 300px;
      border: 1px solid #444466;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #00b894;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🎮 Oyun Platformumuz</h1>
  <p>Tamamen kendi ellerimizle yaptığımız eğlenceli ve reklamsız ücretsiz web oyunları!</p>

  <!-- Senin Oyunun -->
  <div class="oyun-kutusu">
    <h3>🎯 Sayı Tahmin Oyunu</h3>
    <p>Bilgisayar bir sayı tutar ve onu bilmeye çalışırsın</p>
    <a href="sayıtahminoyunu.html">
      <button>Oyna</button>
    </a>
  </div>

  <!-- Arkadaşının 1. Oyun -->
  <div class="oyun-kutusu">
    <h3>🐍 Yılan Oyunu</h3>
    <p>Klasik yılan oyunu</p>
    <a href="yilan.html">
      <button>Oyna</button>
    </a>
  </div>

  <!-- Arkadaşının 2. Oyunu -->
  <div class="oyun-kutusu">
    <h3>Çok yakında sizinle</h3>
    <p>Bu oyun daha yapılmadı ama üstteki oyunların keyfini çıkarın</p>
    <a href="araba.html">
      <button>Oyna</button>
    </a>
  </div>

</body>
</html>
