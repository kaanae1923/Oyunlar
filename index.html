<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizim Oyun Portalı</title>
  <style>
    body {
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      color: #6c5ce7;
      margin-bottom: 20px;
    }

    .oyun-kutusu {
      background: #2d2d44;
      border-radius: 12px;
      padding: 15px;
      margin: 15px auto;
      max-width: 300px;
      border: 1px solid #444466;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s;
    }

    .oyun-kutusu:hover {
      transform: translateY(-3px);
    }

    .oyun-kutusu h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #a29bfe;
    }

    .oyun-kutusu p {
      font-size: 0.9rem;
      color: #cccccc;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #6c5ce7;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #5b4cc4;
    }
  </style>
</head>
<body>

  <h1>Bizim Oyun Portalı</h1>

  <!-- Oyun 1 -->
  <div class="oyun-kutusu">
    <h2>Yılan Oyunu</h2>
    <p>Klasik yılan oyunuyla eğlenceli vakit geçirin.</p>
    <a href="#" class="btn">Oyna</a>
  </div>

  <!-- Oyun 2 -->
  <div class="oyun-kutusu">
    <h2>XOX Oyunu</h2>
    <p>Arkadaşınla veya bilgisayara karşı oyna.</p>
    <a href="#" class="btn">Oyna</a>
  </div>

</body>
</html>
