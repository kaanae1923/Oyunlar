<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji & Desenli Mobil ve PC Yılan Oyunu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: #1e293b;
            border-radius: 12px 12px 0 0;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 2px solid #334155;
        }

        canvas {
            background-color: #0f172a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 100%;
            touch-action: none;
        }

        /* Menü ve Pop-up Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
        }

        /* Özel Oyun Bitti Ekranı */
        #game-over-overlay {
            display: none;
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .game-over-title {
            font-size: 32px;
            color: #ef4444;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .game-over-score {
            font-size: 26px;
            color: #f8fafc;
            font-weight: bold;
            margin-bottom: 25px;
            background: #1e293b;
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid #334155;
        }

        .menu-title {
            font-size: 26px;
            margin-bottom: 15px;
            color: #22c55e;
            text-align: center;
            font-weight: 800;
        }

        .setting-group {
            width: 100%;
            margin-bottom: 12px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #94a3b8;
        }

        .setting-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            font-size: 15px;
            outline: none;
        }

        .btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Mobil Kontroller */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            width: 210px;
            height: 140px;
        }

        .ctrl-btn {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .ctrl-btn:active {
            background: #22c55e;
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <div>Puan: <span id="score">0</span></div>
        <div>Rekor: <span id="high-score">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Menü ve Ayarlar -->
    <div id="menu-overlay" class="overlay">
        <h1 class="menu-title">🐍 YILAN MACERASI 🍎</h1>
        
        <div class="setting-group">
            <label for="skin">Yılan Deseni / Modeli:</label>
            <select id="skin">
                <option value="viper" selected>🐍 Orman Engereği (Gerçekçi Yeşil)</option>
                <option value="python">🐆 Piton Deseni (Sarı/Kahve)</option>
                <option value="cyber">⚡ Siber Neon (Mavi Işıklı)</option>
                <option value="dragon">🔥 Ejderha Pulları (Kırmızı/Altın)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="foodType">Yem Emojileri:</label>
            <select id="foodType">
                <option value="mix" selected>🎲 Karışık Emojiler (🍎, 🐭, 🐸, 🍕, 💎)</option>
                <option value="apple">🍎 Sadece Elma</option>
                <option value="animals">🐭 Küçük Hayvanlar (Fare & Kurbağa)</option>
                <option value="gems">💎 Değerli Taşlar</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="difficulty">Oyun Zorluğu:</label>
            <select id="difficulty">
                <option value="easy">Kolay (Yavaş)</option>
                <option value="medium" selected>Orta (Normal)</option>
                <option value="hard">Zor (Hızlı)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="graphics">Grafik Çeşitleri:</label>
            <select id="graphics">
                <option value="high" selected>✨ Yüksek (Işık, Gölge & Parlama)</option>
                <option value="medium">🎨 Orta (Desenli & Temiz)</option>
                <option value="low">⚡ Düşük (Kasmayan Düz Görünüm)</option>
            </select>
        </div>

        <button class="btn" id="start-btn">BAŞLA 🚀</button>
    </div>

    <!-- ÖZEL OYUN BİTTİ EKRANI -->
    <div id="game-over-overlay" class="overlay">
        <div class="game-over-title">💥 OYUN BİTTİ! 💥</div>
        <div class="game-over-score" id="final-score">TOPLAM PUAN: 0</div>
        <button class="btn" id="restart-btn">TEKRAR OYNA 🔄</button>
    </div>

    <!-- Mobil / Ekran Kontrolleri -->
    <div class="controls">
        <div class="ctrl-btn" id="btn-up">▲</div>
        <div class="ctrl-btn" id="btn-left">◀</div>
        <div class="ctrl-btn" id="btn-right">▶</div>
        <div class="ctrl-btn" id="btn-down">▼</div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("high-score");
    const menuOverlay = document.getElementById("menu-overlay");
    const gameOverOverlay = document.getElementById("game-over-overlay");
    const finalScoreEl = document.getElementById("final-score");
    
    const startBtn = document.getElementById("start-btn");
    const restartBtn = document.getElementById("restart-btn");
    
    const skinSelect = document.getElementById("skin");
    const foodSelect = document.getElementById("foodType");
    const difficultySelect = document.getElementById("difficulty");
    const graphicsSelect = document.getElementById("graphics");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    
    let snake = [];
    let food = { x: 0, y: 0, emoji: '🍎' };
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem("snake_emoji_highscore") || 0;
    highScoreEl.innerText = highScore;

    let gameInterval;
    let speed = 90;
    let tongueFrame = 0;
    let isGameRunning = false;

    const emojiList = ['🍎', '🐭', '🐸', '🍕', '💎', '🍓', '🍔'];

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", () => {
        gameOverOverlay.style.display = "none";
        menuOverlay.style.display = "flex";
    });

    function startGame() {
        const diff = difficultySelect.value;
        if (diff === 'easy') speed = 130;
        else if (diff === 'medium') speed = 90;
        else if (diff === 'hard') speed = 60;

        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        dx = 1; dy = 0;
        nextDx = 1; nextDy = 0;
        score = 0;
        scoreEl.innerText = score;

        generateFood();
        menuOverlay.style.display = "none";
        gameOverOverlay.style.display = "none";

        isGameRunning = true;
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, speed);
    }

    function generateFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        
        const type = foodSelect.value;
        if (type === 'apple') food.emoji = '🍎';
        else if (type === 'animals') food.emoji = Math.random() > 0.5 ? '🐭' : '🐸';
        else if (type === 'gems') food.emoji = '💎';
        else food.emoji = emojiList[Math.floor(Math.random() * emojiList.length)];

        snake.forEach(seg => {
            if (seg.x === food.x && seg.y === food.y) generateFood();
        });
    }

    function gameLoop() {
        update();
        draw();
    }

    function update() {
        dx = nextDx;
        dy = nextDy;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            gameOver();
            return;
        }

        for (let i = 0; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.innerText = score;
            if (score > highScore) {
                highScore = score;
                highScoreEl.innerText = highScore;
                localStorage.setItem("snake_emoji_highscore", highScore);
            }
            generateFood();
        } else {
            snake.pop();
        }

        tongueFrame++;
    }

    function draw() {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const graphics = graphicsSelect.value;

        if (graphics !== 'low') {
            ctx.strokeStyle = "rgba(255,255,255,0.03)";
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
                ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
        }

        ctx.font = `${gridSize - 2}px Sans-Serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        if (graphics === 'high') {
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ffeb3b";
        }
        
        ctx.fillText(
            food.emoji, 
            food.x * gridSize + gridSize / 2, 
            food.y * gridSize + gridSize / 2 + 2
        );
        ctx.shadowBlur = 0;

        drawSnake(graphics);
    }

    function drawSnake(graphics) {
        const skin = skinSelect.value;

        for (let i = snake.length - 1; i >= 0; i--) {
            const seg = snake[i];
            const px = seg.x * gridSize + gridSize / 2;
            const py = seg.y * gridSize + gridSize / 2;
            const radius = gridSize / 2 - 1;

            if (i === 0) {
                drawHead(px, py, radius, skin, graphics);
            } else {
                drawBody(px, py, radius, skin, graphics, i);
            }
        }
    }

    function drawHead(px, py, radius, skin, graphics) {
        ctx.save();
        ctx.translate(px, py);

        let angle = 0;
        if (dx === 1) angle = 0;
        else if (dx === -1) angle = Math.PI;
        else if (dy === 1) angle = Math.PI / 2;
        else if (dy === -1) angle = -Math.PI / 2;
        ctx.rotate(angle);

        if (graphics === 'high') {
            ctx.shadowBlur = 12;
            ctx.shadowColor = skin === 'cyber' ? '#00f0ff' : skin === 'dragon' ? '#ff3300' : 'rgba(0,0,0,0.5)';
        }

        let headGrad = ctx.createRadialGradient(-2, -2, 2, 0, 0, radius);
        if (skin === 'viper') {
            headGrad.addColorStop(0, "#22c55e");
            headGrad.addColorStop(1, "#15803d");
        } else if (skin === 'python') {
            headGrad.addColorStop(0, "#eab308");
            headGrad.addColorStop(1, "#854d0e");
        } else if (skin === 'cyber') {
            headGrad.addColorStop(0, "#00f0ff");
            headGrad.addColorStop(1, "#004080");
        } else if (skin === 'dragon') {
            headGrad.addColorStop(0, "#ef4444");
            headGrad.addColorStop(1, "#7f1d1d");
        }

        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.ellipse(2, 0, radius, radius - 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = skin === 'cyber' ? '#ff0055' : '#fff';
        ctx.beginPath();
        ctx.arc(4, -4, 3, 0, Math.PI * 2);
        ctx.arc(4, 4, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#000";
        ctx.fillRect(5, -5, 1, 2);
        ctx.fillRect(5, 3, 1, 2);

        if (tongueFrame % 4 < 2) {
            ctx.strokeStyle = "#ff0055";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(radius + 7, 0);
            ctx.lineTo(radius + 10, -3);
            ctx.moveTo(radius + 7, 0);
            ctx.lineTo(radius + 10, 3);
            ctx.stroke();
        }

        ctx.restore();
    }

    function drawBody(px, py, radius, skin, graphics, index) {
        ctx.save();
        const size = Math.max(radius - (index / snake.length) * 2, 4);

        if (graphics === 'high') {
            ctx.shadowBlur = 5;
            ctx.shadowColor = skin === 'cyber' ? 'rgba(0, 240, 255, 0.4)' : 'rgba(0,0,0,0.3)';
        }

        let bodyGrad = ctx.createRadialGradient(px, py, 1, px, py, size);
        
        if (skin === 'viper') {
            bodyGrad.addColorStop(0, "#4ade80");
            bodyGrad.addColorStop(1, "#166534");
        } else if (skin === 'python') {
            bodyGrad.addColorStop(0, index % 2 === 0 ? "#fef08a" : "#ca8a04");
            bodyGrad.addColorStop(1, "#713f12");
        } else if (skin === 'cyber') {
            bodyGrad.addColorStop(0, index % 2 === 0 ? "#38bdf8" : "#0284c7");
            bodyGrad.addColorStop(1, "#0f172a");
        } else if (skin === 'dragon') {
            bodyGrad.addColorStop(0, index % 2 === 0 ? "#f87171" : "#b91c1c");
            bodyGrad.addColorStop(1, "#450a0a");
        }

        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();

        if (graphics !== 'low') {
            ctx.strokeStyle = skin === 'cyber' ? '#00f0ff' : 'rgba(0,0,0,0.25)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            if (skin === 'dragon') {
                ctx.arc(px, py, size - 2, 0, Math.PI);
            } else {
                ctx.arc(px, py, size - 1, 0, Math.PI * 2);
            }
            ctx.stroke();
        }

        ctx.restore();
    }

    function gameOver() {
        isGameRunning = false;
        clearInterval(gameInterval);
        finalScoreEl.innerText = "TOPLAM PUAN: " + score;
        gameOverOverlay.style.display = "flex";
    }

    // --- GELİŞMİŞ BİLGİSAYAR KLAVYE KONTROLLERİ ---
    window.addEventListener("keydown", e => {
        // Ok tuşları ile tarayıcı sayfasının kaymasını engelle
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
            e.preventDefault();
        }

        // Oyun Bittiğinde veya Menüdeyken Enter/Boşluk ile Başlatma
        if ((e.code === "Space" || e.code === "Enter") && !isGameRunning) {
            if (gameOverOverlay.style.display === "flex") {
                restartBtn.click();
            } else if (menuOverlay.style.display !== "none") {
                startBtn.click();
            }
            return;
        }

        // Yön Kontrolleri (Ok Tuşları, WASD ve Numpad)
        switch (e.key) {
            // YUKARI (Up, W, 8)
            case "ArrowUp": case "w": case "W": case "8":
                if (dy === 0) { nextDx = 0; nextDy = -1; } break;
            
            // AŞAĞI (Down, S, 2)
            case "ArrowDown": case "s": case "S": case "2":
                if (dy === 0) { nextDx = 0; nextDy = 1; } break;
            
            // SOL (Left, A, 4)
            case "ArrowLeft": case "a": case "A": case "4":
                if (dx === 0) { nextDx = -1; nextDy = 0; } break;
            
            // SAĞ (Right, D, 6)
            case "ArrowRight": case "d": case "D": case "6":
                if (dx === 0) { nextDx = 1; nextDy = 0; } break;
        }
    });

    // Mobil Buton Kontrolleri
    const bindBtn = (id, newDx, newDy, cond) => {
        const btn = document.getElementById(id);
        const action = (e) => {
            if (e.cancelable) {
                e.preventDefault();
            }
            if (cond()) { nextDx = newDx; nextDy = newDy; }
        };
        btn.addEventListener("touchstart", action, { passive: false });
        btn.addEventListener("click", action);
    };

    bindBtn("btn-up", 0, -1, () => dy === 0);
    bindBtn("btn-down", 0, 1, () => dy === 0);
    bindBtn("btn-left", -1, 0, () => dx === 0);
    bindBtn("btn-right", 1, 0, () => dx === 0);

    // Mobil Touch Swipe Kontrolleri
    let startX = 0, startY = 0;
    canvas.addEventListener("touchstart", e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    });

    canvas.addEventListener("touchend", e => {
        let diffX = e.changedTouches[0].clientX - startX;
        let diffY = e.changedTouches[0].clientY - startY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 25 && dx === 0) { nextDx = 1; nextDy = 0; }
            else if (diffX < -25 && dx === 0) { nextDx = -1; nextDy = 0; }
        } else {
            if (diffY > 25 && dy === 0) { nextDx = 0; nextDy = 1; }
            else if (diffY < -25 && dy === 0) { nextDx = 0; nextDy = -1; }
        }
    });
</script>
</body>
</html>
