<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong Oyunu</title>
  <style>
    body {
      background-color: #1e1e2f;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      touch-action: none;
    }
    h1 {
      color: #a29bfe;
      margin: 10px 0 5px 0;
    }
    p {
      color: #b2bec3;
      margin-bottom: 10px;
    }
    #gameCanvas {
      background-color: #0f0f1a;
      border: 3px solid #444466;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      max-width: 100%;
    }
    .btn-container {
      margin-top: 15px;
    }
    .btn {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 10px 25px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover {
      background: #5b4bc4;
    }
  </style>
</head>
<body>

  <h1>🏓 Retro Pong</h1>
  <p>Raketinle topu karşıla ve bilgisayarı yen!</p>

  <canvas id="gameCanvas" width="400" height="500"></canvas>

  <div class="btn-container">
    <a href="index.html" class="btn" style="background: #2d2d44; border: 1px solid #444466;">Ana Sayfaya Dön</a>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Skorlar
    let playerScore = 0;
    let cpuScore = 0;

    // Oyuncu Raketi (Alt taraf)
    const player = {
      x: canvas.width / 2 - 40,
      y: canvas.height - 20,
      width: 80,
      height: 12,
      color: "#6c5ce7"
    };

    // Bilgisayar Raketi (Üst taraf)
    const cpu = {
      x: canvas.width / 2 - 40,
      y: 8,
      width: 80,
      height: 12,
      color: "#ff7675",
      speed: 3.5
    };

    // Top
    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 8,
      speedX: 4,
      speedY: 4,
      color: "#fdcb6e"
    };

    // Kontroller (Mobil ve Masaüstü)
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      player.x = e.clientX - rect.left - player.width / 2;
    });

    canvas.addEventListener("touchmove", (e) => {
      const rect = canvas.getBoundingClientRect();
      player.x = e.touches[0].clientX - rect.left - player.width / 2;
      e.preventDefault();
    }, { passive: false });

    // Topu Sıfırla
    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speedX = (Math.random() > 0.5 ? 1 : -1) * 4;
      ball.speedY = (Math.random() > 0.5 ? 1 : -1) * 4;
    }

    // Çarpışma Testi
    function collision(b, p) {
      return (
        b.x + b.radius > p.x &&
        b.x - b.radius < p.x + p.width &&
        b.y + b.radius > p.y &&
        b.y - b.radius < p.y + p.height
      );
    }

    // Güncelleme
    function update() {
      // Top Hareketi
      ball.x += ball.speedX;
      ball.y += ball.speedY;

      // Yan Duvarlar
      if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
        ball.speedX = -ball.speedX;
      }

      // Bilgisayar Yapay Zekası
      const cpuTarget = ball.x - cpu.width / 2;
      cpu.x += (cpuTarget - cpu.x) * 0.08;

      // Raket Çarpışmaları
      let activePaddle = ball.y > canvas.height / 2 ? player : cpu;

      if (collision(ball, activePaddle)) {
        ball.speedY = -ball.speedY;
        // Hızı hafifçe artır
        ball.speedY *= 1.05;
        ball.speedX *= 1.05;
      }

      // Sayı Durumları
      if (ball.y - ball.radius < 0) {
        playerScore++;
        resetBall();
      } else if (ball.y + ball.radius > canvas.height) {
        cpuScore++;
        resetBall();
      }

      // Sınır Kontrolleri
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
      if (cpu.x < 0) cpu.x = 0;
      if (cpu.x + cpu.width > canvas.width) cpu.x = canvas.width - cpu.width;
    }

    // Çizim
    function draw() {
      // Arka Plan
      ctx.fillStyle = "#0f0f1a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Orta Çizgi
      ctx.strokeStyle = "#444466";
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();

      // Skor Yazıları
      ctx.font = "bold 24px sans-serif";
      ctx.fillStyle = "#ff7675";
      ctx.fillText(`Bilgisayar: ${cpuScore}`, 20, canvas.height / 2 - 20);

      ctx.fillStyle = "#6c5ce7";
      ctx.fillText(`Sen: ${playerScore}`, 20, canvas.height / 2 + 40);

      // Oyuncu
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // Bilgisayar
      ctx.fillStyle = cpu.color;
      ctx.fillRect(cpu.x, cpu.y, cpu.width, cpu.height);

      // Top
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = ball.color;
      ctx.fill();
      ctx.closePath();
    }

    // Oyun Döngüsü
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>

</body>
</html>
